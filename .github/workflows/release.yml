name: Build and publish Transcriptor

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set app version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $source = Get-Content main.py -Raw
          $source = $source -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content -Path main.py -Value $source -Encoding utf8
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all llama_cpp --collect-all faster_whisper --hidden-import llama_cpp.llama --name Transcriptor main.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Transcriptor.exe
