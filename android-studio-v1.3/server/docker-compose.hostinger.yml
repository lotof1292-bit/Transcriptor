services:
  transcriptor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${STUDIO_ENV_FILE:-.env}
    environment:
      STUDIO_OLLAMA_URL: http://ollama:11434
      HF_HOME: /home/studio/.cache/huggingface
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - huggingface-cache:/home/studio/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${STUDIO_MEMORY_LIMIT:-12G}

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  huggingface-cache:
  ollama-data:
